services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restometra
      POSTGRES_USER: restometra
      POSTGRES_PASSWORD: restometra
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restometra -d restometra"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
