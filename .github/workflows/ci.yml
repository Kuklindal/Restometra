name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restometra_test
          POSTGRES_USER: restometra
          POSTGRES_PASSWORD: restometra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restometra -d restometra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://restometra:restometra@127.0.0.1:5432/restometra_test
      TEST_DATABASE_URL: postgresql+psycopg://restometra:restometra@127.0.0.1:5432/restometra_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest -q
      - name: Проверить запуск FastAPI
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 8 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
